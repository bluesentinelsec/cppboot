[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cppboot"
version = "0.1.0"
description = "Bootstrap a professional-grade C++ project environment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "cppboot contributors" }]
keywords = ["c++", "cmake", "bootstrap", "scaffold", "project-generator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cppboot = "cppboot.cli:main"

[project.urls]
Homepage = "https://github.com/example/cppboot"
Repository = "https://github.com/example/cppboot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cppboot = ["py.typed"]
